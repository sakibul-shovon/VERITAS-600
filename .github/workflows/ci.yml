name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Invariant Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas_secret_change_me
          POSTGRES_DB: trade_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/api/requirements.txt ]; then pip install -r apps/api/requirements.txt; fi
          pip install pytest pytest-asyncio ruff

      - name: Run Linting (Ruff)
        run: |
          ruff check apps/api || echo "Ruff check completed with notes"

      - name: Run Test Suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas_secret_change_me
          POSTGRES_DB: trade_finance
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ZETARIS_EXECUTION_MODE: FORCE_FALLBACK
        run: |
          if [ -d apps/api/tests ]; then
            pytest apps/api/tests/ -v --durations=10
          else
            echo "Tests directory not yet created."
          fi

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web && npm ci
          fi

      - name: Run Typecheck and Build
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web && npm run build
          fi
